# Keyless model and isolated-path patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()

- id: shell-env
  config:
    mhHome: './.mh-home'

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  config:
    mhHome: './.mh-home'
    agentsHome: './.agents-home'

- id: session-persistence-jsonl
  config:
    root: './.sessions'

- insert:
    - id: cli-mock-llm
      name: '../../../../../../../packages/test-support/loader-smoke/tests/fixtures/cli-mock-llm.ts'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.MH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

# A search key reference no runner sets: the turn runs as a deployment without
# web search credentials, whatever the launching environment exports.
- id: web-search-deepseek
  config:
    apiKeyEnv: MH_KEYLESS_SMOKE_SEARCH_KEY
