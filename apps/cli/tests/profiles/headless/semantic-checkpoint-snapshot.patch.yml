# Patch for resuming one seeded semantic-checkpoint session over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: replay
      name: '@master-harness/llm-replay'
      config:
        file: !!js process.env.MH_SNAPSHOT_FILE
        overrideFile: !!js process.env.MH_SNAPSHOT_OVERRIDE

    # Publish the persisted agent before the driver selects the single root.
    - id: resumed-agent
      name: './tests/fixtures/semantic-checkpoint-agent.ts'

- id: session-log-deepseek
  config:
    enabled: false

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.MH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
