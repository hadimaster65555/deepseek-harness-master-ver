# Workspace-context snapshot patch: the harness exports MH_HOME=<cwd>/.mh and
# MH_AGENTS_HOME=<cwd>/.agents, so project-root and both user-global root
# discoveries stay inside the scenario's temporary cwd.
- id: agent-default-model
  name: '@master-harness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js mhHomePath('sessions')
    compression: !!js 'process.env.MH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@master-harness/agent-instructions'
  config:
    maxBytes: 700
    projectRootMarkers:
      - .mh-project

- id: system-prompt
  name: '@master-harness/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
