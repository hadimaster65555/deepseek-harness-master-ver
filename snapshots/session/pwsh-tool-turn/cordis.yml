# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-deepseek
  name: '@master-harness/llm-deepseek-api-key'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@master-harness/subprocess-local'

- id: bash-sandbox
  name: '@master-harness/bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@master-harness/pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@master-harness/shell-env'

- id: agent-default-model
  name: '@master-harness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js mhHomePath('sessions')
    compression: !!js 'process.env.MH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@master-harness/agent-instructions'
  disabled: true

- id: system-prompt
  name: '@master-harness/system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@master-harness/goal'
  disabled: true

- id: goal-round-driver
  name: '@master-harness/goal-round-driver'
  disabled: true

- id: command-goal
  name: '@master-harness/command-goal'
  disabled: true

- id: tool-goal
  name: '@master-harness/tool-goal'
  disabled: true

- id: skill
  name: '@master-harness/skill'
  disabled: true

- id: skill-filesystem
  name: '@master-harness/skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@master-harness/tool-skill'
  disabled: true

- id: tool-bash
  name: '@master-harness/tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@master-harness/tool-pwsh'
  disabled: false
