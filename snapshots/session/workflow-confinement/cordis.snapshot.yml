# Replay the authored model turns through the shipped OS sandbox.
- id: llm-deepseek
  name: '@master-harness/llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js mhHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@master-harness/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
