# Native Cordis inspection alongside the base spawn and workflow capabilities.
- id: agent-default-model
  name: '@master-harness/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js mhHomePath('sessions')
    compression: !!js 'process.env.MH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@master-harness/agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@master-harness/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@master-harness/cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@master-harness/tool-cordis/host'
    - id: tool-cordis
      name: '@master-harness/tool-cordis'
