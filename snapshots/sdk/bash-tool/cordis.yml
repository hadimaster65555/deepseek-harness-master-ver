# SDK snapshot-record composition without provider-specific upload metadata.

- id: skill-filesystem
  name: '@master-harness/skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@master-harness/llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js mhHomePath('sessions')
    compression: !!js "process.env.MH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@master-harness/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

- id: session-log-deepseek
  config:
    enabled: false
