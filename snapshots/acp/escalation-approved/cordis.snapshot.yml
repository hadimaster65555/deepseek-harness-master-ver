# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-deepseek
  name: '@master-harness/llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@master-harness/acp'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@master-harness/session-persistence-jsonl'
  config:
    root: !!js process.env.MH_SNAPSHOT_SESSIONS_ROOT ?? mhHomePath('sessions')
    compression: none

- id: sandbox
  name: '@master-harness/sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@master-harness/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/mh-escalated.txt && cat /tmp/mh-escalated.txt && rm /tmp/mh-escalated.txt"
        recordedPath: /tmp/mh-escalated.txt
        livePath: !!js process.env.MH_SNAPSHOT_SPILL_ROOT + '/mh-escalated.txt'
