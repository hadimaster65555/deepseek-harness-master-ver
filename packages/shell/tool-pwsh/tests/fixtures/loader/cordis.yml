# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@master-harness/system-prompt'

- id: fs
  name: '@master-harness/fs-local'

- id: session-projections
  name: '@master-harness/session-projection'

- id: working-directory
  name: '@master-harness/working-directory'

- id: tools
  name: '@master-harness/tools'

- id: tool-executor-native
  name: '@master-harness/tool-executor-native'

- id: subprocess
  name: '@master-harness/subprocess-local'

- id: bash
  name: '@master-harness/pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@master-harness/shell-env'

- id: tasks
  name: '@master-harness/jobs-local'

- id: tool-jobs
  name: '@master-harness/tool-jobs'

- id: tool-pwsh
  name: '@master-harness/tool-pwsh'
