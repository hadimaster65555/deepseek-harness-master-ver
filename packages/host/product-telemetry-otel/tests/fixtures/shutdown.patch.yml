- id: session-telemetry-otel
  disabled: true
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: product-telemetry-otel
      name: '@master-harness/host-product-telemetry-otel'
      config:
        endpoint: !!js process.env.MH_PRODUCT_TELEMETRY_TEST_ENDPOINT
        serviceName: mh-telemetry-test
        serviceVersion: !!js process.env.MH_APP_VERSION
        compression: gzip
        scheduledDelayMillis: 30000
        timeoutMillis: 15000
        exportTimeoutMillis: 20000
        shutdownTimeoutMillis: 2000

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.MH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
